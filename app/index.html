<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sigma Connect</title>
    <script>
      // GitHub Pages SPA redirect: restore the path encoded by 404.html
      (function() {
        var p = (window.location.search.slice(1).split('&').find(function(s){ return s.startsWith('p=') }) || '')
        if (p) window.history.replaceState(null, null, '/' + decodeURIComponent(p.slice(2)))
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
